# ChromaShell audio chains — hosted by chromashell-audio.service via
# `pipewire -c chains.conf` (own client instance, restartable without
# touching the main PipeWire daemon).
#
# All plugins run inside native filter-chain graphs, so their controls are
# settable at runtime via `pw-cli set-param <node> Props` (audio-param.sh).
# Requires in the service environment:
#   LADSPA_PATH -> libdeep_filter_ladspa (nixpkgs#deepfilternet)
#   LV2_PATH    -> lsp-plugins, x42-plugins
#
# Topology (external node names are unchanged, routing scripts keep working):
#   mic:     mic_chain_in     -> [ nr -> gate -> comp ] -> mic_chain_out
#   chat:    chat_chain_in    -> [ nr -> comp ]         -> chat_chain_out
#   general: general_chain_in -> [ eq ]                 -> general_chain_out

context.properties = { }

context.modules = [
    {   name = libpipewire-module-rt
        args = {
            nice.level = -11
        }
        flags = [ ifexists nofail ]
    }
    {   name = libpipewire-module-protocol-native }
    {   name = libpipewire-module-client-node }
    {   name = libpipewire-module-adapter }

    # ── Mic chain: DeepFilterNet -> LSP Gate -> LSP Compressor ────────────
    {   name  = libpipewire-module-filter-chain
        flags = [ nofail ]
        args  = {
            node.description = "Mic Chain"
            filter.graph = {
                nodes = [
                    {   type    = ladspa
                        name    = nr
                        plugin  = libdeep_filter_ladspa
                        label   = deep_filter_stereo
                        control = {
                            "Attenuation Limit (dB)" = 100.0
                        }
                    }
                    {   type   = lv2
                        name   = gate
                        plugin = "http://lsp-plug.in/plugins/lv2/gate_stereo"
                    }
                    {   type   = lv2
                        name   = comp
                        plugin = "http://lsp-plug.in/plugins/lv2/compressor_stereo"
                    }
                ]
                links = [
                    { output = "nr:Audio Out L"  input = "gate:in_l" }
                    { output = "nr:Audio Out R"  input = "gate:in_r" }
                    { output = "gate:out_l"      input = "comp:in_l" }
                    { output = "gate:out_r"      input = "comp:in_r" }
                ]
                inputs  = [ "nr:Audio In L" "nr:Audio In R" ]
                outputs = [ "comp:out_l"    "comp:out_r"    ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "mic_chain_in"
                node.description = "Mic Chain In"
                media.class      = "Audio/Sink"
            }
            playback.props = {
                node.name        = "mic_chain_out"
                node.description = "Mic Chain Out"
                media.class      = "Audio/Source"
                node.passive     = true
            }
        }
    }

    # ── Chat chain: DeepFilterNet -> LSP Compressor ───────────────────────
    {   name  = libpipewire-module-filter-chain
        flags = [ nofail ]
        args  = {
            node.description = "Chat Chain"
            filter.graph = {
                nodes = [
                    {   type    = ladspa
                        name    = nr
                        plugin  = libdeep_filter_ladspa
                        label   = deep_filter_stereo
                        control = {
                            "Attenuation Limit (dB)" = 100.0
                        }
                    }
                    {   type   = lv2
                        name   = comp
                        plugin = "http://lsp-plug.in/plugins/lv2/compressor_stereo"
                    }
                ]
                links = [
                    { output = "nr:Audio Out L" input = "comp:in_l" }
                    { output = "nr:Audio Out R" input = "comp:in_r" }
                ]
                inputs  = [ "nr:Audio In L" "nr:Audio In R" ]
                outputs = [ "comp:out_l"    "comp:out_r"    ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "chat_chain_in"
                node.description = "Chat Chain In"
                media.class      = "Audio/Sink"
            }
            playback.props = {
                node.name        = "chat_chain_out"
                node.description = "Chat Chain Out"
                media.class      = "Audio/Source"
                node.passive     = true
            }
        }
    }

    # ── General chain: fil4 parametric EQ ─────────────────────────────────
    {   name  = libpipewire-module-filter-chain
        flags = [ nofail ]
        args  = {
            node.description = "General Chain"
            filter.graph = {
                nodes = [
                    {   type   = lv2
                        name   = eq
                        plugin = "http://gareus.org/oss/lv2/fil4#stereo"
                    }
                ]
                inputs  = [ "eq:inL"  "eq:inR"  ]
                outputs = [ "eq:outL" "eq:outR" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "general_chain_in"
                node.description = "General Chain In"
                media.class      = "Audio/Sink"
            }
            playback.props = {
                node.name        = "general_chain_out"
                node.description = "General Chain Out"
                media.class      = "Audio/Source"
                node.passive     = true
            }
        }
    }
]
