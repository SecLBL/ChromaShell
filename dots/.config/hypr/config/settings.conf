# ══════════════════════════════════════════
#  ChromaShell — Settings
# ══════════════════════════════════════════

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(cba6f7ee)
    col.inactive_border = rgba(45475aaa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(1e1e2ecc)
    }
}

animations {
    enabled = true

    bezier = expo,    0.05, 0.9, 0.1, 1.05
    bezier = linear,  0.0, 0.0, 1.0, 1.0
    bezier = overshot, 0.13, 0.99, 0.29, 1.1

    animation = windows,     1, 5,  expo,    slide
    animation = windowsOut,  1, 4,  expo,    slide
    animation = border,      1, 8,  linear
    animation = fade,        1, 6,  expo
    animation = workspaces,  1, 5,  overshot, slide
}

input {
    kb_layout = de
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}
